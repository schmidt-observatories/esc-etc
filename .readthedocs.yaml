# Read the Docs build configuration for the esc-etc Sphinx site.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  apt_packages:
    # nbsphinx renders the tutorial notebooks via pandoc
    - pandoc
  jobs:
    # The tutorial notebooks are rendered from saved outputs
    # (nbsphinx_execute = "never"), so nothing runs at build time.
    post_install:
      - pip install -e .

sphinx:
  configuration: docs/sphinx/conf.py
  fail_on_warning: false

python:
  install:
    # Sphinx + theme + nbsphinx + esc_etc's third-party runtime deps
    - requirements: docs/sphinx/requirements.txt

formats:
  - htmlzip
