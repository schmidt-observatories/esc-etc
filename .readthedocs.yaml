# Read the Docs build configuration for the esc-etc Sphinx site.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  apt_packages:
    # nbsphinx renders the tutorial notebooks via pandoc
    - pandoc
  jobs:
    # esc_etc's UASAL config dependencies (config_um / config_stp_esc /
    # utils_config) are git installs and are only imported lazily inside the
    # from_default / from_config constructors. We mock those imports for the
    # docs (docs/sphinx/conf.py: autodoc_mock_imports) and install the package
    # WITHOUT its deps; the real third-party libraries autodoc needs come from
    # docs/sphinx/requirements.txt (installed via python.install below). The
    # tutorial notebooks are rendered from saved outputs (nbsphinx_execute =
    # "never"), so the configs are not needed at build time.
    post_install:
      - pip install -e . --no-deps

sphinx:
  configuration: docs/sphinx/conf.py
  fail_on_warning: false

python:
  install:
    # Sphinx + theme + nbsphinx + esc_etc's third-party runtime deps
    - requirements: docs/sphinx/requirements.txt

formats:
  - htmlzip
