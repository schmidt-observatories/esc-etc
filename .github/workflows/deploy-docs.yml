name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Permissions required by the official GitHub Pages deploy actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pandoc (needed by nbsphinx to render notebooks)
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install the package and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          # esc_etc's UASAL config dependencies (config_um / config_stp_esc /
          # utils_config) are git installs imported lazily inside the
          # from_default / from_config constructors. For the docs we mock those
          # imports (docs/sphinx/conf.py: autodoc_mock_imports) and install
          # esc_etc WITHOUT its deps; the real third-party libraries autodoc
          # needs come from docs/sphinx/requirements.txt.
          pip install -r docs/sphinx/requirements.txt   # Sphinx + theme + esc_etc's runtime deps
          pip install -e . --no-deps                    # importable for autodoc; skips git config deps

      - name: Build the Sphinx site
        run: sphinx-build -W --keep-going -b html docs/sphinx docs/sphinx/_build/html

      - name: Upload the built site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/sphinx/_build/html

  # Deploy only on pushes to main (not on PRs). Enable GitHub Pages with
  # Source = GitHub Actions for this to publish.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
