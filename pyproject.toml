# This part shouldn't change
[build-system]
requires = ["setuptools>=77", "setuptools-scm"]
build-backend = "setuptools.build_meta" 

[project]
name = "esc_etc" # <- Edit this (repo name)
authors = [
  {name = "Aaron Goldtooth", email = "gold1992@arizona.edu"},
  {name = "Justin Hom", email = "jrhom@arizona.edu"},
  {name = "Jess Johnson", email = "jajohnson@arizona.edu"},
  {name = "Sanchit Sabhlok", email = "ssabhlok@arizona.edu"},
  {name = "Gudmundur Stefansson", email = "gstefansson@schmidtsciences.org"}
]
maintainers = [
  {name = "Justin Hom", email = "jrhom@arizona.edu"}
]
description = "Exposure time calculator for the ExtraSolar Camera (ESC) on the UA Ultramarine 3 m"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "COPYRIGHT"]
requires-python = ">=3.11"
# The UASAL config_um / config_um_esc files are vendored under
# src/esc_etc/data/uasal (see scripts/sync_uasal_configs.py), so no git
# dependencies: PyPI rejects direct URL requirements.
dependencies = [
    "synphot",
    "scipy",
    "numpy",
    "astropy",
    "matplotlib",
    "pandas",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest", "build", "twine", "ruff"]
# Sphinx toolchain for the docs site under docs/sphinx/. CI and Read the Docs use
# `pip install -r docs/sphinx/requirements.txt && pip install -e .`.
# nbsphinx also requires a `pandoc` binary on the build machine.
docs = [
  "sphinx>=7",
  "sphinx-rtd-theme>=2.0",
  "nbsphinx>=0.9",
  "ipykernel",
  "myst-parser",
]

[project.urls]
Homepage = "https://github.com/schmidt-observatories/esc-etc/blob/main/README.md"
Changelog = "https://github.com/schmidt-observatories/esc-etc/blob/main/docs/sphinx/changelog.rst"
Repository = "https://github.com/schmidt-observatories/esc-etc"

[tool.setuptools]
packages = ["esc_etc"] # Edit this to package name (repo name)
package-dir = { "" = "src" }
include-package-data = true

# Generated the _version.py automatically from GitHub tags
[tool.setuptools_scm]
write_to = "src/esc_etc/_version.py" # Modify the path where the _version.py lives
version_scheme = "post-release"
local_scheme = "node-and-date"

[tool.pytest.ini_options]
testpaths = [
	"tests",
]

# This should match the path for the write_to under tool.setuptools_scm
[tool.coverage.run]
omit=["src/esc_etc/_version.py"] # Modify the path where the _version.py lives

[tool.setuptools.package-data]
"esc_etc" = ["data/*.mplstyle", "data/esc_filters_eol/*.csv", "data/esc_filters_bol/*.csv", "data/uasal/**/*"]

[tool.ruff]
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
