# This part shouldn't change
[build-system]
requires = ["setuptools", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta" 

[project]
name = "esc_etc" # <- Edit this (repo name)
authors = [
  {name = "Aaron Goldtooth", email = "gold1992@arizona.edu"},
  {name = "Justin Hom", email = "jrhom@arizona.edu"},
  {name = "Jess Johnson", email = "jajohnson@arizona.edu"},
  {name = "Sanchit Sabhlok", email = "ssabhlok@arizona.edu"},
  {name = "Gudmundur Stefansson", email = "gstefansson@schmidtsciences.org"}
]
maintainers = [
  {name = "Justin Hom", email = "jrhom@arizona.edu"}
]
description = "Exposure time calculator the ExtraSolar Camera" # Edit this
readme = "README.md"
license = { text = "GNU GENERAL PUBLIC LICENSE - Verison 3" }
requires-python = ">=3.8"
dependencies = [
    "utils_config @ git+https://github.com/uasal/utils_config.git@develop",
    "config_um @ git+https://github.com/uasal/config_um.git",
    "config_um_esc @ git+https://github.com/uasal/config_um_esc.git",
    "synphot",
    "numpy",
    "astropy",
    "matplotlib",
    "pandas",
]
dynamic = ["version"]

[project.optional-dependencies]
dev= ["config_stp @ git+https://github.com/uasal/config_stp.git",
      "config_stp_esc @ git+https://github.com/uasal/config_stp_esc.git",   "pytest"]
# Sphinx toolchain for the docs site under docs/sphinx/. Note this extra pulls
# in esc_etc's base dependencies too, including the UASAL config git installs —
# convenient locally, but CI and Read the Docs instead use
# `pip install -r docs/sphinx/requirements.txt && pip install -e . --no-deps`
# so the git dependencies are never needed. nbsphinx also requires a `pandoc`
# binary on the build machine.
docs = [
  "sphinx>=7",
  "sphinx-rtd-theme>=2.0",
  "nbsphinx>=0.9",
  "ipykernel",
  "myst-parser",
]

[project.urls]
Homepage = "https://github.com/schmidt-observatories/esc-etc/blob/main/README.md"
Changelog = "https://github.com/schmidt-observatories/esc-etc/blob/main/docs/sphinx/changelog.rst"
Repository = "https://github.com/schmidt-observatories/esc-etc"

[tool.setuptools]
packages = ["esc_etc"] # Edit this to package name (repo name)
package-dir = { "" = "src" }
include-package-data = true

# Generated the _version.py automatically from GitHub tags
[tool.setuptools_scm]
write_to = "src/esc_etc/_version.py" # Modify the path where the _version.py lives
version_scheme = "post-release"
local_scheme = "node-and-date"

[tool.pytest.ini_options]
testpaths = [
	"tests",
]

# This should match the path for the write_to under tool.setuptools_scm
[tool.coverage.run]
omit=["src/esc_etc/_version.py"] # Modify the path where the _version.py lives

[tool.setuptools.package-data]
"esc_etc" = ["support_data/**/*", "configs/**/*.toml", "data/*.mplstyle", "data/esc_filters_eol/*.csv", "data/esc_filters_bol/*.csv"]
